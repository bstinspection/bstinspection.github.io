<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<link rel="stylesheet" href="{{ '/assets/fonts/fonts.css' | relative_url }}">
<link rel="preload" href="{{ '/assets/fonts/inter-400-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/poppins-700-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/images/background.webp' | relative_url }}?v={{ site.cache_buster }}" as="image" type="image/webp">
<link rel="preload" href="{{ '/images/background.jpg' | relative_url }}?v={{ site.cache_buster }}" as="image" type="image/jpeg">
<link rel="stylesheet" href="{{ '/assets/css/style.min.css' | relative_url }}">
<link rel="icon" type="image/webp" href="{{ '/images/logo_透明.webp' | relative_url }}?v={{ site.cache_buster }}">
